version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: minibroker_postgres
    restart: always
    environment:
      POSTGRES_USER: minibroker
      POSTGRES_PASSWORD: minibroker_password
      POSTGRES_DB: minibroker
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minibroker -d minibroker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
